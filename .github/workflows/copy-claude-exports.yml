name: Copy pinned Claude exports to existing private R2
on:
  push:
    branches: [experiment/hierarchy-tower]
    paths:
      - 'tools/claude-export-transfer/**'
      - '.github/workflows/copy-claude-exports.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: private-claude-export-copy
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic transfer boundaries
        run: python -m unittest discover -s tools/claude-export-transfer -p 'test_transfer.py' -v
      - name: Copy source archives and verify R2 read-back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/claude-export-transfer/transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-export-transfer-metadata
          path: claude-transfer-result/result.json
          retention-days: 7
