# Deploys Group Canvas to Cloudflare Workers from GitHub Actions.
# Uses a Cloudflare API token instead of the Cloudflare GitHub app, so it works
# even when the dashboard's "Connect GitHub" flow fails. Everything is set up
# from a browser: no computer or terminal needed.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Recommended (uploaded to the Worker as runtime secrets on every deploy):
#   ROOM_SIGNING_KEY       32+ random characters
#   CREATE_ROOM_KEY        24+ random characters (only holders can create rooms)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOM_SIGNING_KEY: ${{ secrets.ROOM_SIGNING_KEY }}
      CREATE_ROOM_KEY: ${{ secrets.CREATE_ROOM_KEY }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Upload runtime secrets
        if: steps.creds.outputs.ready == 'true'
        run: |
          for name in ROOM_SIGNING_KEY CREATE_ROOM_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::warning::$name is not set in GitHub secrets; not uploaded."
            fi
          done
