name: Read-only private cabinet upload status
on:
  push:
    branches: [experiment/hierarchy-tower]
    paths:
      - 'tools/archive-transfer/audit-cabinet.mjs'
      - '.github/workflows/audit-cabinet.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check completed conversation uploads without logging contents
        env:
          CREATE_ROOM_KEY: ${{ secrets.CREATE_ROOM_KEY }}
        run: node tools/archive-transfer/audit-cabinet.mjs
