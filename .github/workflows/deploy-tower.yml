name: Deploy hierarchy tower experiment
on:
  push:
    branches: [experiment/hierarchy-tower]
    paths:
      - 'public/tower/**'
      - 'experiments/hierarchy-tower/**'
      - '.github/workflows/deploy-tower.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: hierarchy-tower-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test tower model and static worker
        run: node --test experiments/hierarchy-tower/model.test.js
      - name: Check browser modules
        run: |
          node --check public/tower/tower.js
          node --check public/tower/model.js
      - name: Install deployment tool
        run: npm install --no-audit --no-fund
      - name: Deploy separate tower preview
        run: npx wrangler deploy --config experiments/hierarchy-tower/wrangler.toml
