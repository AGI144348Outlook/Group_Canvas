name: Deploy hierarchy tower experiment
on:
  push:
    branches: [experiment/hierarchy-tower]
    paths:
      - 'public/tower/**'
      - 'experiments/hierarchy-tower/**'
      - 'experiments/session-towers/**'
      - 'experiments/card-chat/**'
      - 'tools/card-chat/**'
      - 'tools/session-towers/**'
      - 'experiments/adapter-cards/**'
      - '.github/workflows/deploy-tower.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: hierarchy-tower-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      CREATE_ROOM_KEY: ${{ secrets.CREATE_ROOM_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test tower model and static worker
        run: |
          node experiments/hierarchy-tower/model.test.js
          node experiments/hierarchy-tower/archive.test.js
          node experiments/hierarchy-tower/upload.test.js
          node experiments/hierarchy-tower/filing.test.js
          node experiments/adapter-cards/engine.test.js
          node experiments/session-towers/engine.test.js
          node experiments/session-towers/service.test.js
          node experiments/session-towers/cards.test.js
          node tools/session-towers/run.test.mjs
          node experiments/card-chat/service.test.js
      - name: Check browser modules
        run: |
          node --check public/tower/tower.js
          node --check public/tower/model.js
          node --check public/tower/archive-parser.js
          node --check public/tower/archive-db.js
          node --check public/tower/archive-import.js
          node --check public/tower/archive-worker.js
          node --check public/tower/archive-ui.js
          node --check public/tower/cloud-source.js
          node --check public/tower/adapter-engine.js
          node --check public/tower/adapter-ui.js
          node --check experiments/hierarchy-tower/upload-service.js
          node --check experiments/hierarchy-tower/filing-service.js
          node --check public/tower/files.js
          node --check public/tower/sessions.js
          node --check experiments/session-towers/service.js
          node --check public/tower/chat.js
          node --check experiments/card-chat/service.js
      - name: Install deployment tool
        run: npm install --no-audit --no-fund
      - name: Prepare private source bucket
        id: storage
        run: |
          if npx wrangler r2 bucket info group-canvas-citadel-sources > /tmp/citadel-r2-check.log 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif npx wrangler r2 bucket create group-canvas-citadel-sources > /tmp/citadel-r2-create.log 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 source storage could not be prepared. Check R2 enablement and token Object Read & Write permissions. Local import will still deploy."
            cat /tmp/citadel-r2-check.log
            cat /tmp/citadel-r2-create.log
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy tower with private source binding
        if: steps.storage.outputs.ready == 'true'
        run: npx wrangler deploy --config experiments/hierarchy-tower/wrangler-storage.toml
      - name: Configure operator-only source creation
        if: steps.storage.outputs.ready == 'true'
        run: |
          if [ "${#CREATE_ROOM_KEY}" -ge 24 ]; then
            printf '%s' "$CREATE_ROOM_KEY" | npx wrangler secret put SOURCE_CREATE_KEY --config experiments/hierarchy-tower/wrangler-storage.toml
          else
            echo "::warning::CREATE_ROOM_KEY must contain 24+ characters. Source creation remains disabled."
          fi
      - name: Deploy tower with local import only
        if: steps.storage.outputs.ready != 'true'
        run: npx wrangler deploy --config experiments/hierarchy-tower/wrangler.toml

      - name: Verify live filing storage with synthetic data
        if: steps.storage.outputs.ready == 'true'
        run: node experiments/hierarchy-tower/filing-live-check.js

      - name: Verify output bindings and build approved private session towers
        if: steps.storage.outputs.ready == 'true'
        run: node tools/session-towers/run.mjs

      - name: Evaluate hosted model and cards on bounded actual records
        if: steps.storage.outputs.ready == 'true'
        run: node tools/card-chat/live-check.mjs
