name: Build and verify private month line
on:
  push:
    branches: [experiment/hierarchy-tower]
    paths: ['experiments/month-timeline/**', '.github/workflows/month-timeline.yml']
permissions:
  contents: read
concurrency:
  group: echo-private-month-line
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check compiler, model and read-only Worker
        run: |
          node --test experiments/month-timeline/tests.mjs experiments/month-timeline/worker.test.mjs
          node --check experiments/month-timeline/public/app.js
          node --check experiments/month-timeline/prepare.mjs
      - name: Prepare and read-back verify private month manifest
        env:
          CREATE_ROOM_KEY: ${{ secrets.CREATE_ROOM_KEY }}
        run: node experiments/month-timeline/prepare.mjs
      - name: Deploy isolated month artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy --config experiments/month-timeline/wrangler.toml
      - name: Install browser controller
        run: python -m pip install playwright==1.55.0
      - name: Check phone interaction and real private loading
        env:
          CREATE_ROOM_KEY: ${{ secrets.CREATE_ROOM_KEY }}
        run: python experiments/month-timeline/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: month-line-evidence
          path: |
            month-result/
            experiments/month-timeline/qa/
          retention-days: 7
