name = "group-canvas-tower"
main = "worker.js"
compatibility_date = "2026-10-01"
[assets]
directory = "../../public/tower"
binding = "ASSETS"
run_worker_first = true
[[r2_buckets]]
binding = "SOURCES"
bucket_name = "group-canvas-citadel-sources"
[[durable_objects.bindings]]
name = "UPLOADS"
class_name = "TowerUpload"
[[migrations]]
tag = "citadel-uploads-v1"
new_sqlite_classes = ["TowerUpload"]

[[durable_objects.bindings]]
name = "CABINETS"
class_name = "FileCabinet"
[[migrations]]
tag = "filing-cabinet-v1"
new_sqlite_classes = ["FileCabinet"]

[[r2_buckets]]
binding = "SELF_OUTPUT"
bucket_name = "group-canvas-tower-self"

[[r2_buckets]]
binding = "JULIAN_OUTPUT"
bucket_name = "group-canvas-tower-julian"
